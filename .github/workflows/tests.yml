name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # The project targets Windows (Task Scheduler, keep-awake), so this is the job that must pass.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (real mistakes only)
        run: python -m ruff check src tests
      - name: Run the tests
        # No real browser, network or Naukri account is needed; tests marked "manual" are excluded by default.
        run: python -m pytest -q

  pytest-linux:
    # Experimental: shows whether the code and tests also work on Linux. A failure here does not fail the build.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run the tests
        run: python -m pytest -q
